<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d14">
<title>AI Ассистент</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d14;
    --panel:rgba(16,19,30,.65);
    --bubble-bot:rgba(30,34,50,.55);
    --bubble-border:rgba(255,255,255,.07);
    --text:#eef0f6;
    --text-dim:#8b93a7;
    --accent1:#6366f1;
    --accent2:#a855f7;
    --on-accent:#ffffff;
    --error-bg:rgba(255,80,80,.10);
    --error-border:rgba(255,80,80,.35);
    --error-text:#ffb4b4;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  body{
    font-family:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 520px at 88% -10%, rgba(99,102,241,.20), transparent 60%),
      radial-gradient(820px 520px at -10% 112%, rgba(168,85,247,.15), transparent 60%),
      var(--bg);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    max-width:860px;
    height:100dvh;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    background:var(--panel);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-left:1px solid var(--bubble-border);
    border-right:1px solid var(--bubble-border);
    box-shadow:0 30px 90px rgba(0,0,0,.45);
  }

  /* ---------- Шапка ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 20px;
    border-bottom:1px solid var(--bubble-border);
    background:rgba(12,15,24,.6);
  }
  .bot-info{display:flex;align-items:center;gap:12px;min-width:0}
  .avatar{
    width:44px;height:44px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow:0 8px 22px rgba(99,102,241,.4);
    flex-shrink:0;
    color:#fff;
  }
  .avatar svg{width:22px;height:22px}
  .bot-name{font-weight:800;font-size:16.5px;letter-spacing:.2px}
  .bot-status{
    display:flex;align-items:center;gap:6px;
    font-size:12.5px;color:var(--text-dim);margin-top:2px;
  }
  .bot-status .dot{
    width:8px;height:8px;border-radius:50%;
    background:#34d399;
    box-shadow:0 0 0 0 rgba(52,211,153,.5);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(52,211,153,.45)}
    70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}
    100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}
  }

  .icon-btn{
    width:40px;height:40px;border-radius:12px;
    border:1px solid var(--bubble-border);
    background:rgba(255,255,255,.05);
    color:var(--text-dim);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .22s ease;
    flex-shrink:0;
  }
  .icon-btn:hover{
    color:var(--accent1);
    border-color:rgba(99,102,241,.5);
    background:rgba(99,102,241,.10);
    transform:rotate(-40deg);
  }
  .icon-btn:active{transform:rotate(-40deg) scale(.92)}

  /* ---------- Лента сообщений ---------- */
  #chat{
    flex:1;
    overflow-y:auto;
    padding:22px 20px 14px;
    display:flex;
    flex-direction:column;
    gap:14px;
    overscroll-behavior:contain;
  }
  #chat::-webkit-scrollbar{width:8px}
  #chat::-webkit-scrollbar-track{background:transparent}
  #chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
  #chat::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}

  /* ---------- Пустой экран ---------- */
  .empty-state{
    margin:auto;
    text-align:center;
    max-width:580px;
    width:100%;
    padding:20px 0;
  }
  .hero-logo{
    width:76px;height:76px;
    margin:0 auto 20px;
    border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow:0 14px 40px rgba(99,102,241,.4);
    color:#fff;
    animation:fadeUp .5s ease both;
  }
  .hero-logo svg{width:38px;height:38px}
  .hero-title{
    font-size:28px;
    font-weight:800;
    letter-spacing:-.4px;
    margin-bottom:10px;
    background:linear-gradient(135deg,#fff 30%,#a5a9c8);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:fadeUp .5s ease .05s both;
  }
  .hero-sub{
    color:var(--text-dim);
    font-size:15px;
    line-height:1.5;
    max-width:420px;
    margin:0 auto;
    animation:fadeUp .5s ease .1s both;
  }
  .suggestions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:32px;
    text-align:left;
  }
  .suggestion{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.03);
    color:var(--text);
    cursor:pointer;
    font-family:inherit;
    font-size:13.5px;
    line-height:1.45;
    text-align:left;
    transition:all .2s ease;
    animation:fadeUp .5s ease both;
  }
  .suggestion:nth-child(1){animation-delay:.15s}
  .suggestion:nth-child(2){animation-delay:.2s}
  .suggestion:nth-child(3){animation-delay:.25s}
  .suggestion:nth-child(4){animation-delay:.3s}
  .suggestion:hover{
    border-color:rgba(129,140,248,.45);
    background:rgba(129,140,248,.09);
    transform:translateY(-2px);
  }
  .suggestion:active{transform:translateY(0)}
  .s-ico{font-size:18px;flex-shrink:0;line-height:1.4}

  /* ---------- Сообщения ---------- */
  .msg{
    display:flex;
    gap:10px;
    max-width:86%;
    animation:fadeUp .28s ease both;
  }
  .msg.user{align-self:flex-end;justify-content:flex-end}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(9px)}
    to{opacity:1;transform:translateY(0)}
  }

  .msg .ava{
    width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    flex-shrink:0;
    margin-top:2px;
    color:#fff;
  }
  .msg .ava svg{width:17px;height:17px}

  .msg-content{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:0;
  }
  .msg.user .msg-content{align-items:flex-end}

  .bubble{
    padding:12px 16px;
    border-radius:18px;
    font-size:15px;
    line-height:1.6;
    word-break:break-word;
    min-width:34px;
    white-space:normal;
  }
  .msg.bot .bubble{
    background:var(--bubble-bot);
    border:1px solid var(--bubble-border);
    border-top-left-radius:6px;
  }
  .msg.user .bubble{
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    color:var(--on-accent);
    font-weight:600;
    border-top-right-radius:6px;
    box-shadow:0 8px 24px rgba(99,102,241,.28);
    white-space:pre-wrap;
  }
  .msg.error .bubble{
    background:var(--error-bg);
    border:1px solid var(--error-border);
    color:var(--error-text);
    font-size:14px;
    border-top-left-radius:6px;
    max-width:100%;
  }

  /* Внутреннее форматирование в сообщениях бота */
  .bubble h1,.bubble h2,.bubble h3{
    margin:12px 0 6px;
    font-weight:800;
    line-height:1.3;
    letter-spacing:-.2px;
  }
  .bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child{margin-top:0}
  .bubble h1{font-size:19px}
  .bubble h2{font-size:17px}
  .bubble h3{font-size:15.5px}
  .bubble p{margin:6px 0}
  .bubble p:first-child{margin-top:0}
  .bubble p:last-child{margin-bottom:0}
  .bubble ul,.bubble ol{margin:6px 0;padding-left:22px}
  .bubble li{margin:3px 0}
  .bubble strong{color:#fff;font-weight:700}
  .bubble em{color:#c9cde8}
  .bubble a{color:#a5b4fc;text-decoration:none;border-bottom:1px solid rgba(165,180,252,.4)}
  .bubble a:hover{color:#c7d2fe;border-bottom-color:rgba(199,210,254,.7)}
  .bubble code.inline-code{
    background:rgba(255,255,255,.09);
    padding:1px 6px;
    border-radius:5px;
    font-family:'JetBrains Mono','SF Mono',Consolas,monospace;
    font-size:13.5px;
    color:#e9d5ff;
  }
  .bubble pre.code{
    background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.07);
    padding:12px 14px;
    border-radius:10px;
    margin:10px 0;
    overflow-x:auto;
    font-size:13px;
    line-height:1.55;
  }
  .bubble pre.code code{
    font-family:'JetBrains Mono','SF Mono',Consolas,monospace;
    color:#e2e8f0;
    white-space:pre;
  }

  /* Кнопка копирования */
  .msg-actions{
    display:flex;
    gap:6px;
    opacity:0;
    transition:opacity .2s ease;
    padding:0 4px;
  }
  .msg:hover .msg-actions{opacity:1}
  .action-btn{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 9px;
    border-radius:8px;
    border:1px solid var(--bubble-border);
    background:rgba(255,255,255,.04);
    color:var(--text-dim);
    cursor:pointer;
    font-family:inherit;
    font-size:11.5px;
    transition:all .18s ease;
  }
  .action-btn:hover{
    color:var(--accent1);
    border-color:rgba(99,102,241,.4);
    background:rgba(99,102,241,.08);
  }
  .action-btn.copied{
    color:#34d399;
    border-color:rgba(52,211,153,.45);
    background:rgba(52,211,153,.08);
  }

  /* мигающий курсор во время печати ответа */
  .bubble.cursor::after{
    content:'▍';
    color:var(--accent2);
    margin-left:2px;
    animation:blink .8s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* индикатор «печатает…» */
  .typing{display:flex;gap:5px;padding:4px 2px}
  .typing span{
    width:7px;height:7px;border-radius:50%;
    background:var(--text-dim);
    animation:hop 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.18s}
  .typing span:nth-child(3){animation-delay:.36s}
  @keyframes hop{
    0%,60%,100%{transform:translateY(0);opacity:.35}
    30%{transform:translateY(-5px);opacity:1}
  }

  /* ---------- Поле ввода ---------- */
  footer{
    padding:14px 20px 16px;
    border-top:1px solid var(--bubble-border);
    background:rgba(12,15,24,.6);
  }
  .input-wrap{
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.10);
    border-radius:22px;
    padding:8px 8px 8px 18px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .input-wrap:focus-within{
    border-color:rgba(99,102,241,.55);
    box-shadow:0 0 0 3px rgba(99,102,241,.12);
  }
  textarea{
    flex:1;
    background:none;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    line-height:1.5;
    max-height:160px;
    padding:8px 0;
  }
  textarea::placeholder{color:var(--text-dim)}

  #sendBtn{
    width:40px;height:40px;border-radius:50%;
    border:none;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    color:var(--on-accent);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s ease;
    flex-shrink:0;
    box-shadow:0 4px 14px rgba(99,102,241,.35);
  }
  #sendBtn:not(:disabled):hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(99,102,241,.5)}
  #sendBtn:not(:disabled):active{transform:scale(.94)}
  #sendBtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

  .hint{
    text-align:center;
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:9px;
    user-select:none;
  }

  /* ---------- Мобильная версия ---------- */
  @media (max-width:600px){
    .app{border-left:none;border-right:none;box-shadow:none}
    .msg{max-width:93%}
    #chat{padding:18px 14px 10px}
    footer{padding:12px 14px 14px}
    .hero-title{font-size:23px}
    .hero-sub{font-size:14px}
    .suggestions{grid-template-columns:1fr;margin-top:26px}
    .hero-logo{width:64px;height:64px;border-radius:18px}
    .hero-logo svg{width:32px;height:32px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="app">

  <header>
    <div class="bot-info">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2c.55 4.6 3.4 7.45 8 8-4.6.55-7.45 3.4-8 8-.55-4.6-3.4-7.45-8-8 4.6-.55 7.45-3.4 8-8z"/>
        </svg>
      </div>
      <div>
        <div class="bot-name">AI Ассистент</div>
        <div class="bot-status"><span class="dot"></span> онлайн · Ollama Cloud</div>
      </div>
    </div>
    <button class="icon-btn" id="resetBtn" title="Очистить историю диалога" aria-label="Очистить историю">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
  </header>

  <main id="chat"></main>

  <footer>
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Напишите сообщение…"></textarea>
      <button id="sendBtn" title="Отправить" aria-label="Отправить">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4Z"/>
          <path d="M22 2 11 13"/>
        </svg>
      </button>
    </div>
    <div class="hint">Enter — отправить · Shift+Enter — новая строка</div>
  </footer>

</div>

<script>
  /* ---------- DOM ---------- */
  const chatEl   = document.getElementById('chat');
  const inputEl  = document.getElementById('input');
  const sendBtn  = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');

  let streaming   = false;
  let stickBottom = true;

  const SPARKLE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c.55 4.6 3.4 7.45 8 8-4.6.55-7.45 3.4-8 8-.55-4.6-3.4-7.45-8-8 4.6-.55 7.45-3.4 8-8z"/></svg>';
  const COPY_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const CHECK_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

  // Токен сессии: по нему сервер хранит историю нашего диалога
  const token = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now() + '-' + Math.random().toString(36).slice(2);

  /* ---------- Markdown-рендерер (безопасный, без внешних библиотек) ---------- */
  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderMarkdown(src){
    let s = esc(src);

    // 1) Блоки кода ``` ... ```
    const codeBlocks = [];
    s = s.replace(/```([\w-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const i = codeBlocks.length;
      codeBlocks.push('<pre class="code"><code>' + code.replace(/\n$/, '') + '</code></pre>');
      return '\u0000CB' + i + '\u0000';
    });

    // 2) Инлайн-код `...` — защищаем плейсхолдером, чтобы не попал в ** **
    const inlineCode = [];
    s = s.replace(/`([^`\n]+)`/g, (_, code) => {
      const i = inlineCode.length;
      inlineCode.push('<code class="inline-code">' + code + '</code>');
      return '\u0000IC' + i + '\u0000';
    });

    // 3) Жирный / курсив / зачёркнутый
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');

    // 4) Ссылки
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

    // 5) Заголовки
    s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    s = s.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
    s = s.replace(/^# (.+)$/gm,   '<h1>$1</h1>');

    // 6) Списки (построчно)
    const lines = s.split('\n');
    const out = [];
    let list = null;
    const flushList = () => {
      if (list){
        out.push('<' + list.type + '>' + list.items.join('') + '</' + list.type + '>');
        list = null;
      }
    };
    for (const line of lines){
      let m;
      if ((m = line.match(/^\s*[-*]\s+(.+)$/))){
        if (!list || list.type !== 'ul'){ flushList(); list = {type:'ul', items:[]}; }
        list.items.push('<li>' + m[1] + '</li>');
      } else if ((m = line.match(/^\s*\d+\.\s+(.+)$/))){
        if (!list || list.type !== 'ol'){ flushList(); list = {type:'ol', items:[]}; }
        list.items.push('<li>' + m[1] + '</li>');
      } else {
        flushList();
        out.push(line);
      }
    }
    flushList();

    // 7) Склейка с <br>, но не после блочных элементов
    let html = '';
    const isBlock = (x) => /^<(\/)?(h[1-6]|ul|ol|pre|li|p)\b/.test(x) || /\u0000CB\d+\u0000/.test(x);
    for (let i = 0; i < out.length; i++){
      html += out[i];
      if (i < out.length - 1){
        const cur = out[i], nxt = out[i+1];
        if (cur.trim() === '' && nxt.trim() === '') html += '\n';
        else if (isBlock(cur) || isBlock(nxt)) html += '';
        else html += '<br>';
      }
    }

    // 8) Возвращаем защищённые фрагменты
    html = html.replace(/\u0000IC(\d+)\u0000/g, (_, i) => inlineCode[i]);
    html = html.replace(/\u0000CB(\d+)\u0000/g, (_, i) => codeBlocks[i]);
    return html;
  }

  /* ---------- Пустой экран ---------- */
  function showEmptyState(){
    chatEl.innerHTML = `
      <div class="empty-state">
        <div class="hero-logo">${SPARKLE_SVG}</div>
        <h1 class="hero-title">Чем могу помочь?</h1>
        <p class="hero-sub">Задайте любой вопрос — от объяснения сложных тем до помощи с кодом, текстами и планированием.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Объясни простыми словами, как работает блокчейн">
            <span class="s-ico">💡</span>
            <span>Объясни простыми словами, как работает блокчейн</span>
          </button>
          <button class="suggestion" data-prompt="Напиши краткий план статьи о пользе утренних прогулок">
            <span class="s-ico">✍️</span>
            <span>Напиши краткий план статьи о пользе утренних прогулок</span>
          </button>
          <button class="suggestion" data-prompt="Помоги с Python: как работают декораторы? Покажи пример">
            <span class="s-ico">💻</span>
            <span>Помоги с Python: как работают декораторы?</span>
          </button>
          <button class="suggestion" data-prompt="Помоги спланировать продуктивную неделю: 5 рабочих дней, спорт и отдых">
            <span class="s-ico">🎯</span>
            <span>Помоги спланировать продуктивную неделю</span>
          </button>
        </div>
      </div>
    `;
    chatEl.querySelectorAll('.suggestion').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!streaming) sendMessage(btn.dataset.prompt);
      });
    });
    stickBottom = true;
  }

  /* ---------- Вспомогательные ---------- */
  chatEl.addEventListener('scroll', () => {
    stickBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 120;
  });

  function scrollToBottom(){
    if (stickBottom) chatEl.scrollTop = chatEl.scrollHeight;
  }

  function hideEmptyState(){
    const es = chatEl.querySelector('.empty-state');
    if (es) es.remove();
  }

  function addMessage(role, text){
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;

    if (role === 'bot'){
      const ava = document.createElement('div');
      ava.className = 'ava';
      ava.innerHTML = SPARKLE_SVG;
      msg.appendChild(ava);
    }

    const content = document.createElement('div');
    content.className = 'msg-content';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'bot'){
      bubble.innerHTML = renderMarkdown(text);
    } else {
      bubble.textContent = text;
    }
    content.appendChild(bubble);

    if (role === 'bot'){
      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'action-btn';
      copyBtn.type = 'button';
      copyBtn.innerHTML = COPY_SVG + '<span>Копировать</span>';
      copyBtn.addEventListener('click', () => {
        const raw = bubble.innerText;
        const done = () => {
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = CHECK_SVG + '<span>Скопировано</span>';
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = COPY_SVG + '<span>Копировать</span>';
          }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(raw).then(done).catch(done);
        } else {
          const ta = document.createElement('textarea');
          ta.value = raw; document.body.appendChild(ta);
          ta.select(); try { document.execCommand('copy'); } catch(e){}
          ta.remove(); done();
        }
      });
      actions.appendChild(copyBtn);
      content.appendChild(actions);
    }

    msg.appendChild(content);
    chatEl.appendChild(msg);
    scrollToBottom();
    return bubble;
  }

  function showTyping(){
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.innerHTML =
      '<div class="ava">' + SPARKLE_SVG + '</div>' +
      '<div class="msg-content"><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>';
    chatEl.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function autoGrow(){
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  }

  function setStreaming(state){
    streaming = state;
    sendBtn.disabled = state;
    if (!state) inputEl.focus();
  }

  /* ---------- Отправка сообщения (стриминг ответа) ---------- */
  async function sendMessage(text){
    text = (text || '').trim();
    if (!text || streaming) return;

    hideEmptyState();
    addMessage('user', text);
    inputEl.value = '';
    autoGrow();
    setStreaming(true);

    const typingEl = showTyping();
    let botBubble  = null;   // .bubble
    let botMsgEl   = null;   // .msg
    let rawText    = '';
    let hadError   = false;
    let renderQueued = false;

    const scheduleRender = () => {
      if (renderQueued || !botBubble) return;
      renderQueued = true;
      requestAnimationFrame(() => {
        renderQueued = false;
        if (botBubble) botBubble.innerHTML = renderMarkdown(rawText);
        scrollToBottom();
      });
    };

    const finalizeBotMessage = () => {
      if (!botMsgEl) return;
      // добавляем кнопку «Копировать»
      const content = botMsgEl.querySelector('.msg-content');
      if (!content || content.querySelector('.msg-actions')) return;
      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'action-btn';
      copyBtn.type = 'button';
      copyBtn.innerHTML = COPY_SVG + '<span>Копировать</span>';
      copyBtn.addEventListener('click', () => {
        const raw = botBubble ? botBubble.innerText : rawText;
        const done = () => {
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = CHECK_SVG + '<span>Скопировано</span>';
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = COPY_SVG + '<span>Копировать</span>';
          }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(raw).then(done).catch(done);
        } else {
          const ta = document.createElement('textarea');
          ta.value = raw; document.body.appendChild(ta);
          ta.select(); try { document.execCommand('copy'); } catch(e){}
          ta.remove(); done();
        }
      });
      actions.appendChild(copyBtn);
      content.appendChild(actions);
    };

    const handleBlock = (block) => {
      for (const line of block.split('\n')){
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;

        let evt;
        try { evt = JSON.parse(payload); } catch { continue; }

        if (evt.error){ hadError = true; continue; }

        if (typeof evt.delta === 'string'){
          if (!botBubble){
            typingEl.remove();
            botBubble = addMessage('bot', '');
            botBubble.classList.add('cursor');
            botMsgEl = botBubble.closest('.msg');
          }
          rawText += evt.delta;
          scheduleRender();
        }
      }
    };

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token, message: text}),
      });
      if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true){
        const {done, value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});

        let sep;
        while ((sep = buffer.indexOf('\n\n')) !== -1){
          const block = buffer.slice(0, sep);
          buffer = buffer.slice(sep + 2);
          handleBlock(block);
        }
      }
    } catch (e) {
      hadError = true;
    } finally {
      typingEl.remove();
      if (botBubble){
        // финальный рендер на всякий случай
        botBubble.innerHTML = renderMarkdown(rawText);
        botBubble.classList.remove('cursor');
        if (rawText.trim()) finalizeBotMessage();
        else botMsgEl && botMsgEl.remove();
      }
      if (hadError){
        addMessage('error', '⚠️ Не удалось получить ответ от AI. Проверь, что сервер запущен и OLLAMA_API_KEY указан верно, затем отправь сообщение ещё раз.');
      }
      setStreaming(false);
    }
  }

  /* ---------- Сброс диалога ---------- */
  resetBtn.addEventListener('click', async () => {
    if (streaming) return;
    try {
      await fetch('/api/reset', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token}),
      });
    } catch (e) { /* сервер недоступен — просто чистим экран */ }
    showEmptyState();
    inputEl.focus();
  });

  /* ---------- Обработчики ввода ---------- */
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage(inputEl.value);
    }
  });

  inputEl.addEventListener('input', autoGrow);
  sendBtn.addEventListener('click', () => sendMessage(inputEl.value));

  /* ---------- Старт ---------- */
  showEmptyState();
  inputEl.focus();
</script>
</body>
</html>
